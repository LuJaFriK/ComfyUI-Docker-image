#WARNING this yaml has been written mostly by Gemini and corrected by an IT student, may not properly work

services:
  comfy:
    build: .
    container_name: ComfyUI
    ports:
      - "8188:8188"
    environment:
      - HOME=/app
      - COMFYUI_LISTEN=0.0.0.0
    volumes:
      - app_data:/app
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 8188))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  app_data: